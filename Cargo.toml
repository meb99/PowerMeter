[package]
name = "powermeter"
version = "0.1.0"
edition = "2024"
description = "Live-Leistungsmessung (Labornetzteil + Multimeter) mit Graphen und OBS-Overlay für macOS"
authors = ["meb99"]

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui_plot = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libudev is only needed for richer port info on Linux; macOS does not use it.
serialport = { version = "4.10", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
